<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AfterClass Studio - Hero v3</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap");

    :root {
      --acs-paper: #f4efe6;
      --acs-paper-2: #ebe2d5;
      --acs-cream: #fffaf1;
      --acs-ink: #11100e;
      --acs-ink-soft: rgba(17, 16, 14, 0.62);
      --acs-line: rgba(17, 16, 14, 0.13);
      --acs-line-strong: rgba(17, 16, 14, 0.28);
      --acs-glass: rgba(255, 250, 241, 0.58);
      --acs-shadow: 0 34px 90px rgba(36, 29, 22, 0.10);
      --acs-ease: cubic-bezier(0.22, 1, 0.36, 1);
      --acs-x: 74%;
      --acs-y: 34%;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-width: 320px;
      color: var(--acs-ink);
      background: var(--acs-paper);
      font-family: "Inter", "Helvetica Neue", Arial, sans-serif;
    }

    body.acs-menu-open { overflow: hidden; }

    .acs-hero {
      position: relative;
      min-height: 100svh;
      overflow: hidden;
      isolation: isolate;
      background:
        radial-gradient(circle at var(--acs-x) var(--acs-y), rgba(255, 250, 241, 0.96), transparent 18rem),
        radial-gradient(circle at 18% 20%, rgba(255, 250, 241, 0.82), transparent 31rem),
        linear-gradient(135deg, var(--acs-paper), var(--acs-paper-2));
    }

    .acs-hero::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -3;
      background:
        linear-gradient(90deg, rgba(17, 16, 14, 0.045) 1px, transparent 1px),
        linear-gradient(180deg, rgba(17, 16, 14, 0.035) 1px, transparent 1px);
      background-size: clamp(3.2rem, 5vw, 5.4rem) clamp(3.2rem, 5vw, 5.4rem);
      mask-image: linear-gradient(90deg, rgba(0,0,0,0.72), rgba(0,0,0,0.16));
      pointer-events: none;
    }

    .acs-hero::after {
      content: "";
      position: absolute;
      inset: 1rem;
      z-index: -1;
      border: 1px solid rgba(17, 16, 14, 0.09);
      border-radius: clamp(1.05rem, 1.8vw, 1.8rem);
      pointer-events: none;
    }

    .acs-noise {
      position: absolute;
      inset: 0;
      z-index: -2;
      pointer-events: none;
      opacity: 0.23;
      mix-blend-mode: multiply;
      background-image:
        radial-gradient(circle at 20% 30%, rgba(17,16,14,0.12) 0 0.04rem, transparent 0.047rem),
        radial-gradient(circle at 75% 60%, rgba(17,16,14,0.10) 0 0.035rem, transparent 0.043rem);
      background-size: 0.85rem 0.85rem, 1.15rem 1.15rem;
      animation: acs-noise-drift 7s steps(5) infinite;
    }

    .acs-cinema-lines {
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    .acs-cinema-lines::before,
    .acs-cinema-lines::after {
      content: "";
      position: absolute;
      left: 0;
      width: 100%;
      height: clamp(0.38rem, 0.75vw, 0.62rem);
      background: rgba(17, 16, 14, 0.92);
      transform: scaleX(0);
      animation: acs-line-open 1.05s var(--acs-ease) 0.08s forwards;
    }

    .acs-cinema-lines::before { top: 0; transform-origin: left; }
    .acs-cinema-lines::after { bottom: 0; transform-origin: right; }

    .acs-sweep {
      position: absolute;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      opacity: 0.32;
      background: linear-gradient(102deg, transparent 0 42%, rgba(255, 250, 241, 0.95) 50%, transparent 58% 100%);
      transform: translateX(-55%);
      animation: acs-sweep 7.5s var(--acs-ease) infinite alternate;
    }

    .acs-header {
      position: relative;
      z-index: 10;
      display: grid;
      grid-template-columns: minmax(9rem, 13rem) 1fr auto;
      align-items: center;
      gap: 1rem;
      width: min(100%, 1540px);
      margin: 0 auto;
      padding: clamp(1.25rem, 2.4vw, 2.35rem) clamp(1rem, 4.2vw, 4.9rem);
      opacity: 0;
      transform: translateY(-0.65rem);
      animation: acs-reveal-down 0.9s var(--acs-ease) 0.72s forwards;
    }

    .acs-logo-link {
      display: inline-flex;
      align-items: center;
      width: min(12.8rem, 46vw);
      text-decoration: none;
    }

    .acs-logo {
      display: block;
      width: 100%;
      height: auto;
      mix-blend-mode: multiply;
      filter: contrast(1.12);
    }

    .acs-socials {
      justify-self: end;
      display: flex;
      align-items: center;
      gap: 0.38rem;
    }

    .acs-social-link {
      display: grid;
      place-items: center;
      width: 2.45rem;
      height: 2.45rem;
      border: 1px solid var(--acs-line);
      border-radius: 999px;
      color: var(--acs-ink);
      background: rgba(255, 250, 241, 0.38);
      box-shadow: 0 14px 36px rgba(36, 29, 22, 0.045);
      text-decoration: none;
      backdrop-filter: blur(16px);
      transition: border-color 220ms ease, background-color 220ms ease, transform 220ms ease;
    }

    .acs-social-link svg {
      display: block;
      width: 0.94rem;
      height: 0.94rem;
      fill: currentColor;
    }

    .acs-social-link:hover,
    .acs-social-link:focus-visible {
      border-color: var(--acs-line-strong);
      background: rgba(255, 250, 241, 0.86);
      transform: translateY(-2px);
      outline: none;
    }

    .acs-menu-toggle {
      display: none;
      justify-self: end;
      min-height: 2.65rem;
      padding: 0 1rem;
      border: 1px solid var(--acs-line);
      border-radius: 999px;
      color: var(--acs-ink);
      background: rgba(255, 250, 241, 0.72);
      box-shadow: 0 14px 36px rgba(36, 29, 22, 0.055);
      font: 700 0.72rem/1 "Inter", "Helvetica Neue", Arial, sans-serif;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      cursor: pointer;
    }

    .acs-hero-inner {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(18rem, 31rem);
      align-items: center;
      gap: clamp(2rem, 7vw, 6rem);
      width: min(100%, 1540px);
      min-height: calc(100svh - 7.3rem);
      margin: 0 auto;
      padding: clamp(2.6rem, 7vw, 5.8rem) clamp(1rem, 4.2vw, 4.9rem) clamp(3rem, 6vw, 5rem);
    }

    .acs-copy {
      max-width: 68rem;
      transform: translateY(clamp(0rem, 3vw, 2rem));
    }

    .acs-eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 0.9rem;
      margin: 0 0 clamp(1.1rem, 2.2vw, 1.85rem);
      color: rgba(17, 16, 14, 0.54);
      font-size: clamp(0.68rem, 0.82vw, 0.78rem);
      font-weight: 700;
      letter-spacing: 0.19em;
      text-transform: uppercase;
      opacity: 0;
      transform: translateY(0.9rem);
      animation: acs-reveal-up 0.86s var(--acs-ease) 0.94s forwards;
    }

    .acs-eyebrow::before {
      content: "";
      width: clamp(3rem, 8vw, 8.5rem);
      height: 1px;
      background: currentColor;
      opacity: 0.38;
    }

    .acs-title {
      max-width: 11.9ch;
      margin: 0;
      color: var(--acs-ink);
      font-family: "Instrument Serif", "Bodoni 72", Didot, Georgia, serif;
      font-size: clamp(3.9rem, 9vw, 10.8rem);
      font-weight: 400;
      line-height: 0.84;
      letter-spacing: -0.062em;
      text-wrap: balance;
    }

    .acs-title-line {
      display: block;
      overflow: hidden;
      padding-bottom: 0.06em;
    }

    .acs-title-line span {
      display: block;
      transform: translateY(112%);
      opacity: 0.02;
      animation: acs-title-rise 1.08s var(--acs-ease) forwards;
      animation-delay: calc(1.06s + var(--line) * 150ms);
    }

    .acs-side-nav {
      align-self: center;
      justify-self: stretch;
      opacity: 0;
      transform: translateY(0.9rem);
      animation: acs-reveal-up 0.9s var(--acs-ease) 1.24s forwards;
    }

    .acs-side-nav-list {
      display: grid;
      margin: 0;
      padding: 0;
      list-style: none;
      border-top: 1px solid var(--acs-line);
    }

    .acs-side-nav-link {
      position: relative;
      display: grid;
      grid-template-columns: 2.5rem 1fr auto;
      align-items: center;
      gap: 1rem;
      min-height: clamp(4.8rem, 7vw, 6.4rem);
      overflow: hidden;
      border-bottom: 1px solid var(--acs-line);
      color: var(--acs-ink);
      text-decoration: none;
    }

    .acs-side-nav-link::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background: rgba(255, 250, 241, 0.44);
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 520ms var(--acs-ease);
    }

    .acs-side-nav-link:hover::before,
    .acs-side-nav-link:focus-visible::before {
      transform: scaleX(1);
    }

    .acs-side-nav-link:focus-visible { outline: none; }

    .acs-side-nav-link span {
      color: rgba(17, 16, 14, 0.38);
      font-size: 0.74rem;
      font-weight: 700;
      letter-spacing: 0.12em;
    }

    .acs-side-nav-link strong {
      font-family: "Instrument Serif", "Bodoni 72", Didot, Georgia, serif;
      font-size: clamp(1.6rem, 2.7vw, 2.55rem);
      font-weight: 400;
      line-height: 0.96;
      letter-spacing: -0.045em;
    }

    .acs-side-nav-link i {
      width: 1.35rem;
      height: 1.35rem;
      border-top: 1px solid currentColor;
      border-right: 1px solid currentColor;
      opacity: 0.52;
      transform: translateX(-0.2rem) rotate(45deg);
      transition: opacity 260ms ease, transform 420ms var(--acs-ease);
    }

    .acs-side-nav-link:hover i,
    .acs-side-nav-link:focus-visible i {
      opacity: 1;
      transform: translateX(0.22rem) rotate(45deg);
    }

    .acs-bottom {
      position: absolute;
      left: clamp(1rem, 4.2vw, 4.9rem);
      right: clamp(1rem, 4.2vw, 4.9rem);
      bottom: clamp(1.2rem, 3vw, 2.5rem);
      z-index: 4;
      display: flex;
      align-items: center;
      gap: 1rem;
      width: min(calc(100% - clamp(2rem, 8.4vw, 9.8rem)), calc(1540px - clamp(2rem, 8.4vw, 9.8rem)));
      margin: 0 auto;
      color: rgba(17, 16, 14, 0.48);
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      opacity: 0;
      transform: translateY(0.7rem);
      animation: acs-reveal-up 0.85s var(--acs-ease) 1.56s forwards;
    }

    .acs-bottom-line {
      flex: 1 1 auto;
      height: 1px;
      background: rgba(17, 16, 14, 0.12);
    }

    .acs-scroll {
      display: inline-grid;
      place-items: center;
      width: 2.45rem;
      height: 2.45rem;
      border: 1px solid var(--acs-line);
      border-radius: 999px;
      color: var(--acs-ink);
      background: rgba(255, 250, 241, 0.36);
      text-decoration: none;
      transition: background-color 220ms ease, transform 220ms ease;
    }

    .acs-scroll::before {
      content: "";
      width: 0.45rem;
      height: 0.45rem;
      border-right: 1px solid currentColor;
      border-bottom: 1px solid currentColor;
      transform: translateY(-0.12rem) rotate(45deg);
      animation: acs-arrow 1.75s ease-in-out infinite;
    }

    .acs-scroll:hover,
    .acs-scroll:focus-visible {
      background: rgba(255, 250, 241, 0.82);
      transform: translateY(-2px);
      outline: none;
    }

    .acs-mobile-panel {
      position: fixed;
      inset: 0.75rem;
      z-index: 80;
      display: grid;
      align-content: center;
      gap: 1.2rem;
      padding: clamp(1.2rem, 6vw, 2.4rem);
      border: 1px solid var(--acs-line);
      border-radius: 1.8rem;
      background: rgba(244, 239, 230, 0.95);
      box-shadow: var(--acs-shadow);
      backdrop-filter: blur(24px);
      opacity: 0;
      visibility: hidden;
      transform: scale(0.98);
      transition: opacity 260ms ease, visibility 260ms ease, transform 260ms ease;
    }

    .acs-mobile-panel.is-open {
      opacity: 1;
      visibility: visible;
      transform: scale(1);
    }

    .acs-mobile-close {
      position: absolute;
      top: 1rem;
      right: 1rem;
      display: grid;
      place-items: center;
      width: 2.8rem;
      height: 2.8rem;
      border: 1px solid var(--acs-line);
      border-radius: 999px;
      color: var(--acs-ink);
      background: rgba(255, 250, 241, 0.7);
      font-size: 1.25rem;
      cursor: pointer;
    }

    .acs-mobile-nav {
      display: grid;
      gap: 0.35rem;
    }

    .acs-mobile-nav .acs-side-nav-link {
      grid-template-columns: 2.4rem 1fr auto;
      min-height: 4.5rem;
    }

    .acs-mobile-nav .acs-side-nav-link strong {
      font-size: clamp(1.55rem, 7vw, 2.35rem);
    }

    .acs-mobile-socials {
      display: flex;
      gap: 0.55rem;
      padding-top: 1rem;
    }

    .acs-section-anchor { scroll-margin-top: 2rem; }

    @keyframes acs-noise-drift {
      0%, 100% { transform: translate(0, 0); }
      25% { transform: translate(-0.4rem, 0.25rem); }
      50% { transform: translate(0.25rem, -0.35rem); }
      75% { transform: translate(0.35rem, 0.35rem); }
    }

    @keyframes acs-line-open { to { transform: scaleX(1); } }

    @keyframes acs-sweep {
      to { transform: translateX(42%); opacity: 0.42; }
    }

    @keyframes acs-reveal-down {
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes acs-reveal-up {
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes acs-title-rise {
      to { transform: translateY(0); opacity: 1; }
    }

    @keyframes acs-arrow {
      0%, 100% { transform: translateY(-0.15rem) rotate(45deg); }
      50% { transform: translateY(0.16rem) rotate(45deg); }
    }

    @media (max-width: 1120px) {
      .acs-socials { display: none; }
      .acs-menu-toggle { display: inline-flex; align-items: center; justify-content: center; }
      .acs-hero-inner {
        grid-template-columns: 1fr;
        align-items: center;
      }
      .acs-side-nav {
        display: none;
      }
    }

    @media (max-width: 720px) {
      .acs-hero::after { inset: 0.65rem; border-radius: 1.15rem; }
      .acs-header { padding: 1rem; }
      .acs-logo-link { width: min(11.2rem, 49vw); }
      .acs-hero-inner {
        min-height: calc(100svh - 5rem);
        padding: 4.2rem 1rem 6rem;
      }
      .acs-eyebrow {
        margin-bottom: 1rem;
        font-size: 0.62rem;
      }
      .acs-eyebrow::before { width: 2.6rem; }
      .acs-title {
        max-width: 10.5ch;
        font-size: clamp(3.55rem, 17vw, 5.7rem);
      }
      .acs-bottom {
        left: 1rem;
        right: 1rem;
        bottom: 1rem;
        width: calc(100% - 2rem);
        font-size: 0.56rem;
        letter-spacing: 0.12em;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
      }
    }
  </style>
</head>

      </div>

      <button class="acs-menu-toggle" type="button" aria-expanded="false" aria-controls="acsMobilePanel">Menü</button>

    <section class="acs-hero-inner" aria-label="AfterClass Studio hero">

        <p class="acs-eyebrow">AfterClass Studio</p>

    <div class="acs-bottom" aria-hidden="true">
      <span>AfterClass Studio</span>
      <span class="acs-bottom-line"></span>
      <a class="acs-scroll" href="#tablofotozas" aria-label="Ugrás a következő szekcióra"></a>

    <div id="tablofotozas" class="acs-section-anchor"></div>
    <div id="szalagavato" class="acs-section-anchor"></div>
    <div id="selfiegep" class="acs-section-anchor"></div>
    <div id="ajanlatkeres" class="acs-section-anchor"></div>
  </main>

  <div class="acs-mobile-panel" id="acsMobilePanel" aria-hidden="true">
    <button class="acs-mobile-close" type="button" aria-label="Menü bezárása">×</button>
    <nav class="acs-mobile-nav" aria-label="Mobil főmenü">
      <a class="acs-side-nav-link" href="#tablofotozas"><span>01</span><strong>Tablófotózás</strong><i aria-hidden="true"></i></a>

  <script>
    (() => {
      const root = document.querySelector(".acs-hero");
      const body = document.body;
      const toggle = document.querySelector(".acs-menu-toggle");
      const panel = document.querySelector(".acs-mobile-panel");
      const close = document.querySelector(".acs-mobile-close");
      const panelLinks = document.querySelectorAll(".acs-mobile-panel a");

      const setMenuState = (isOpen) => {
        panel.classList.toggle("is-open", isOpen);
        panel.setAttribute("aria-hidden", String(!isOpen));
        toggle.setAttribute("aria-expanded", String(isOpen));
        body.classList.toggle("acs-menu-open", isOpen);
      };

      if (root && window.matchMedia("(pointer: fine)").matches) {
        root.addEventListener("pointermove", (event) => {
          const rect = root.getBoundingClientRect();
          const x = ((event.clientX - rect.left) / rect.width) * 100;
          const y = ((event.clientY - rect.top) / rect.height) * 100;
          root.style.setProperty("--acs-x", `${x.toFixed(2)}%`);
          root.style.setProperty("--acs-y", `${y.toFixed(2)}%`);
        });
      }

      toggle.addEventListener("click", () => setMenuState(true));
      close.addEventListener("click", () => setMenuState(false));
      panelLinks.forEach((link) => link.addEventListener("click", () => setMenuState(false)));
      window.addEventListener("keydown", (event) => {
        if (event.key === "Escape") setMenuState(false);
      });
    })();
  </script>
