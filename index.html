<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AfterClass Studio - Hero v2</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap");

    :root {
      --acs-paper: #f6f2ea;
      --acs-paper-2: #ece5da;
      --acs-porcelain: #fffdf8;
      --acs-ink: #151412;
      --acs-ink-soft: rgba(21, 20, 18, 0.68);
      --acs-line: rgba(21, 20, 18, 0.13);
      --acs-line-strong: rgba(21, 20, 18, 0.22);
      --acs-taupe: #9b8b78;
      --acs-taupe-soft: rgba(155, 139, 120, 0.22);
      --acs-glass: rgba(255, 253, 248, 0.62);
      --acs-shadow: 0 30px 90px rgba(46, 40, 32, 0.10);
      --acs-ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-width: 320px;
      color: var(--acs-ink);
      background: var(--acs-paper);
      font-family: "Inter", "Helvetica Neue", Arial, sans-serif;
    }

    body.acs-menu-open { overflow: hidden; }

    .acs-hero {
      position: relative;
      min-height: 100svh;
      overflow: hidden;
      isolation: isolate;
      background:
        linear-gradient(90deg, rgba(21, 20, 18, 0.045) 1px, transparent 1px),
        linear-gradient(180deg, rgba(21, 20, 18, 0.035) 1px, transparent 1px),
        radial-gradient(circle at 22% 22%, rgba(255, 253, 248, 0.94), transparent 30rem),
        radial-gradient(circle at 82% 18%, rgba(155, 139, 120, 0.16), transparent 34rem),
        linear-gradient(135deg, var(--acs-paper), var(--acs-paper-2));
      background-size: 4.4rem 4.4rem, 4.4rem 4.4rem, auto, auto, auto;
    }

    .acs-hero::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -2;
      opacity: 0.38;
      pointer-events: none;
      background:
        linear-gradient(105deg, transparent 0 36%, rgba(255, 253, 248, 0.88) 49%, transparent 62% 100%);
      transform: translateX(-35%);
      animation: acs-light-sweep 8s var(--acs-ease) infinite alternate;
    }

    .acs-hero::after {
      content: "";
      position: absolute;
      inset: 1rem;
      z-index: -1;
      pointer-events: none;
      border: 1px solid rgba(21, 20, 18, 0.09);
      border-radius: clamp(1.2rem, 2vw, 2rem);
    }

    .acs-film-bars {
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    .acs-film-bars::before,
    .acs-film-bars::after {
      content: "";
      position: absolute;
      left: 0;
      width: 100%;
      height: clamp(0.45rem, 1vw, 0.8rem);
      background: rgba(21, 20, 18, 0.92);
      transform: scaleX(0);
      animation: acs-bar-in 1.15s var(--acs-ease) 0.15s forwards;
    }

    .acs-film-bars::before { top: 0; transform-origin: left; }
    .acs-film-bars::after { bottom: 0; transform-origin: right; }

    .acs-header {
      position: relative;
      z-index: 10;
      display: grid;
      grid-template-columns: minmax(9rem, 13rem) 1fr auto auto;
      align-items: center;
      gap: clamp(0.8rem, 1.4vw, 1.35rem);
      width: min(100%, 1500px);
      margin: 0 auto;
      padding: clamp(1.35rem, 2.6vw, 2.5rem) clamp(1rem, 4.2vw, 4.8rem);
      opacity: 0;
      transform: translateY(-0.7rem);
      animation: acs-reveal-down 0.9s var(--acs-ease) 0.95s forwards;
    }

    .acs-logo-link {
      display: inline-flex;
      align-items: center;
      width: min(12.5rem, 44vw);
      text-decoration: none;
    }

    .acs-logo {
      display: block;
      width: 100%;
      height: auto;
      mix-blend-mode: multiply;
      filter: contrast(1.08);
    }

    .acs-desktop-nav {
      justify-self: end;
      display: flex;
      align-items: center;
      gap: clamp(0.35rem, 0.8vw, 0.7rem);
      padding: 0.35rem;
      border: 1px solid var(--acs-line);
      border-radius: 999px;
      background: rgba(255, 253, 248, 0.48);
      box-shadow: 0 18px 50px rgba(46, 40, 32, 0.06);
      backdrop-filter: blur(18px);
    }

    .acs-nav-link {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      min-height: 2.45rem;
      padding: 0 0.95rem;
      border-radius: 999px;
      color: var(--acs-ink-soft);
      font-family: "Cormorant Garamond", "Bodoni 72", Didot, Georgia, serif;
      font-size: 0.95rem;
      font-weight: 500;
      letter-spacing: 0.025em;
      text-decoration: none;
      text-transform: none;
      transition: color 220ms ease, background-color 220ms ease, transform 220ms ease;
    }

    .acs-nav-link span {
      color: rgba(21, 20, 18, 0.34);
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.04em;
    }

    .acs-nav-link:hover,
    .acs-nav-link:focus-visible {
      color: var(--acs-ink);
      background: rgba(255, 253, 248, 0.82);
      transform: translateY(-1px);
      outline: none;
    }

    .acs-socials {
      justify-self: end;
      display: flex;
      align-items: center;
      gap: 0.34rem;
    }

    .acs-social-link {
      display: grid;
      place-items: center;
      width: 2.45rem;
      height: 2.45rem;
      border: 1px solid var(--acs-line);
      border-radius: 999px;
      color: var(--acs-ink);
      background: rgba(255, 253, 248, 0.42);
      box-shadow: 0 14px 36px rgba(46, 40, 32, 0.05);
      text-decoration: none;
      backdrop-filter: blur(16px);
      transition: border-color 220ms ease, background-color 220ms ease, transform 220ms ease;
    }

    .acs-social-link svg {
      width: 0.96rem;
      height: 0.96rem;
      display: block;
      fill: currentColor;
    }

    .acs-social-link:hover,
    .acs-social-link:focus-visible {
      border-color: var(--acs-line-strong);
      background: rgba(255, 253, 248, 0.86);
      transform: translateY(-2px);
      outline: none;
    }

    .acs-menu-toggle {
      display: none;
      justify-self: end;
      min-height: 2.65rem;
      padding: 0 1rem;
      border: 1px solid var(--acs-line);
      border-radius: 999px;
      color: var(--acs-ink);
      background: rgba(255, 253, 248, 0.72);
      font: 750 0.72rem/1 "Inter", "Helvetica Neue", Arial, sans-serif;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 14px 36px rgba(46, 40, 32, 0.06);
    }

    .acs-hero-inner {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(16rem, 28rem);
      align-items: end;
      gap: clamp(2rem, 6vw, 5rem);
      width: min(100%, 1500px);
      min-height: calc(100svh - 7.5rem);
      margin: 0 auto;
      padding: clamp(3.5rem, 8vw, 7rem) clamp(1rem, 4.2vw, 4.8rem) clamp(2.2rem, 5vw, 4.5rem);
    }

    .acs-copy {
      max-width: 66rem;
      padding-bottom: clamp(0rem, 3vw, 3rem);
    }

    .acs-eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 0.9rem;
      margin: 0 0 clamp(1.2rem, 2.4vw, 2rem);
      color: rgba(21, 20, 18, 0.52);
      font-size: clamp(0.72rem, 0.9vw, 0.82rem);
      font-weight: 720;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      opacity: 0;
      transform: translateY(1rem);
      animation: acs-reveal-up 0.95s var(--acs-ease) 1.15s forwards;
    }

    .acs-eyebrow::before {
      content: "";
      width: clamp(2.6rem, 8vw, 7.5rem);
      height: 1px;
      background: currentColor;
      opacity: 0.38;
    }

    .acs-title {
      max-width: 12.8ch;
      margin: 0;
      color: var(--acs-ink);
      font-family: "Cormorant Garamond", "Bodoni 72", Didot, Georgia, serif;
      font-size: clamp(3.25rem, 8.2vw, 9.2rem);
      font-weight: 500;
      line-height: 0.94;
      letter-spacing: -0.045em;
      text-wrap: balance;
      opacity: 0;
      transform: translateY(1.2rem);
      animation: acs-reveal-up 1s var(--acs-ease) 1.28s forwards;
    }

    .acs-title.is-typing::after {
      content: "";
      display: inline-block;
      width: 0.045em;
      height: 0.78em;
      margin-left: 0.04em;
      background: currentColor;
      transform: translateY(0.08em);
      animation: acs-caret 0.86s steps(1) infinite;
    }

    .acs-title.is-complete::after {
      opacity: 0;
    }

    .acs-service-panel {
      position: relative;
      align-self: center;
      padding: clamp(1.1rem, 2vw, 1.55rem);
      border: 1px solid var(--acs-line);
      border-radius: clamp(1.2rem, 2vw, 1.7rem);
      background: var(--acs-glass);
      box-shadow: var(--acs-shadow);
      backdrop-filter: blur(20px);
      opacity: 0;
      transform: translateY(1rem);
      animation: acs-reveal-up 0.95s var(--acs-ease) 1.48s forwards;
    }

    .acs-service-panel::before {
      content: "";
      position: absolute;
      inset: 0.65rem;
      border: 1px solid rgba(21, 20, 18, 0.075);
      border-radius: calc(clamp(1.2rem, 2vw, 1.7rem) - 0.35rem);
      pointer-events: none;
    }

    .acs-service-list {
      position: relative;
      z-index: 1;
      display: grid;
      gap: 0;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .acs-service-list li {
      display: grid;
      grid-template-columns: 1fr;
      align-items: center;
      gap: 0;
      min-height: clamp(4.2rem, 6vw, 5.3rem);
      border-bottom: 1px solid rgba(21, 20, 18, 0.1);
      color: var(--acs-ink);
    }

    .acs-service-list li:last-child { border-bottom: 0; }

    .acs-service-list strong {
      font-family: "Cormorant Garamond", "Bodoni 72", Didot, Georgia, serif;
      font-size: clamp(1.32rem, 2.15vw, 1.9rem);
      font-weight: 500;
      letter-spacing: -0.03em;
    }

    .acs-bottom-row {
      position: absolute;
      left: clamp(1rem, 4.2vw, 4.8rem);
      right: clamp(1rem, 4.2vw, 4.8rem);
      bottom: clamp(1.35rem, 3vw, 2.7rem);
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      width: min(calc(100% - clamp(2rem, 8.4vw, 9.6rem)), calc(1500px - clamp(2rem, 8.4vw, 9.6rem)));
      margin: 0 auto;
      color: rgba(21, 20, 18, 0.48);
      font-size: 0.7rem;
      font-weight: 720;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      opacity: 0;
      transform: translateY(0.7rem);
      animation: acs-reveal-up 0.9s var(--acs-ease) 1.72s forwards;
    }

    .acs-bottom-line {
      flex: 1 1 auto;
      height: 1px;
      background: rgba(21, 20, 18, 0.12);
    }

    .acs-scroll-dot {
      display: inline-grid;
      place-items: center;
      width: 2.55rem;
      height: 2.55rem;
      border: 1px solid var(--acs-line);
      border-radius: 999px;
      color: var(--acs-ink);
      text-decoration: none;
      background: rgba(255, 253, 248, 0.36);
    }

    .acs-scroll-dot::before {
      content: "";
      width: 0.45rem;
      height: 0.45rem;
      border-right: 1px solid currentColor;
      border-bottom: 1px solid currentColor;
      transform: translateY(-0.12rem) rotate(45deg);
      animation: acs-arrow 1.7s ease-in-out infinite;
    }

    .acs-mobile-panel {
      position: fixed;
      inset: 0.75rem;
      z-index: 80;
      display: grid;
      align-content: center;
      gap: 1.2rem;
      padding: clamp(1.2rem, 6vw, 2.4rem);
      border: 1px solid var(--acs-line);
      border-radius: 1.8rem;
      background: rgba(246, 242, 234, 0.95);
      box-shadow: var(--acs-shadow);
      backdrop-filter: blur(24px);
      opacity: 0;
      visibility: hidden;
      transform: scale(0.98);
      transition: opacity 260ms ease, visibility 260ms ease, transform 260ms ease;
    }

    .acs-mobile-panel.is-open {
      opacity: 1;
      visibility: visible;
      transform: scale(1);
    }

    .acs-mobile-close {
      position: absolute;
      top: 1rem;
      right: 1rem;
      display: grid;
      place-items: center;
      width: 2.8rem;
      height: 2.8rem;
      border: 1px solid var(--acs-line);
      border-radius: 999px;
      color: var(--acs-ink);
      background: rgba(255, 253, 248, 0.7);
      font-size: 1.25rem;
      cursor: pointer;
    }

    .acs-mobile-nav {
      display: grid;
      gap: 0.4rem;
    }

    .acs-mobile-nav .acs-nav-link {
      justify-content: space-between;
      min-height: 3.8rem;
      padding: 0 0.6rem;
      border-bottom: 1px solid var(--acs-line);
      border-radius: 0;
      font-family: "Cormorant Garamond", "Bodoni 72", Didot, Georgia, serif;
      font-size: clamp(1.35rem, 6vw, 2.15rem);
      font-weight: 500;
      letter-spacing: -0.04em;
      text-transform: none;
    }

    .acs-mobile-socials {
      display: flex;
      gap: 0.55rem;
      padding-top: 1rem;
    }

    .acs-section-anchor { scroll-margin-top: 2rem; }

    @keyframes acs-light-sweep {
      to { transform: translateX(28%); opacity: 0.52; }
    }

    @keyframes acs-bar-in {
      to { transform: scaleX(1); }
    }

    @keyframes acs-reveal-down {
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes acs-reveal-up {
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes acs-arrow {
      0%, 100% { transform: translateY(-0.15rem) rotate(45deg); }
      50% { transform: translateY(0.16rem) rotate(45deg); }
    }

    @keyframes acs-caret {
      0%, 45% { opacity: 1; }
      46%, 100% { opacity: 0; }
    }

    @media (max-width: 1160px) {
      .acs-header { grid-template-columns: minmax(8rem, 12rem) 1fr auto; }
      .acs-desktop-nav, .acs-socials { display: none; }
      .acs-menu-toggle { display: inline-flex; align-items: center; justify-content: center; }
      .acs-hero-inner { grid-template-columns: 1fr; align-items: center; }
      .acs-service-panel { width: min(100%, 31rem); justify-self: end; }
    }

    @media (max-width: 720px) {
      .acs-hero::after { inset: 0.65rem; border-radius: 1.15rem; }
      .acs-header { padding: 1rem; }
      .acs-logo-link { width: min(11rem, 48vw); }
      .acs-hero-inner {
        min-height: calc(100svh - 5rem);
        padding: 3.8rem 1rem 5.8rem;
        gap: 1.45rem;
      }
      .acs-eyebrow { font-size: 0.66rem; margin-bottom: 1rem; }
      .acs-title {
        max-width: 11ch;
        font-size: clamp(3rem, 15vw, 5rem);
      }
      .acs-service-panel { justify-self: stretch; }
      .acs-service-list li {
        grid-template-columns: 1fr;
        min-height: 3.8rem;
      }
      .acs-service-list strong { font-size: 1.05rem; }
      .acs-bottom-row {
        left: 1rem;
        right: 1rem;
        bottom: 1.1rem;
        width: calc(100% - 2rem);
        font-size: 0.58rem;
        letter-spacing: 0.12em;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
      }
    }
  </style>
</head>

  <script>
    (() => {
      const body = document.body;
      const toggle = document.querySelector(".acs-menu-toggle");
      const panel = document.querySelector(".acs-mobile-panel");
      const close = document.querySelector(".acs-mobile-close");
      const panelLinks = document.querySelectorAll(".acs-mobile-panel a");
      const title = document.querySelector(".acs-title");

      const typeTitle = () => {
        if (!title) return;
        const fullText = title.dataset.text || title.textContent.trim();
        const letters = Array.from(fullText);
        const duration = 3600;
        const startDelay = 1320;
        title.textContent = "";
        title.classList.add("is-typing");

        window.setTimeout(() => {
          const start = performance.now();
          const tick = (now) => {
            const progress = Math.min((now - start) / duration, 1);
            const eased = 1 - Math.pow(1 - progress, 3);
            const count = Math.floor(eased * letters.length);
            title.textContent = letters.slice(0, count).join("");
            if (progress < 1) {
              requestAnimationFrame(tick);
            } else {
              title.textContent = fullText;
              title.classList.remove("is-typing");
              title.classList.add("is-complete");
            }
          };
          requestAnimationFrame(tick);
        }, startDelay);
      };

      typeTitle();

      const setMenuState = (isOpen) => {
        panel.classList.toggle("is-open", isOpen);
        panel.setAttribute("aria-hidden", String(!isOpen));
        toggle.setAttribute("aria-expanded", String(isOpen));
        body.classList.toggle("acs-menu-open", isOpen);
      };

      toggle.addEventListener("click", () => setMenuState(true));
      close.addEventListener("click", () => setMenuState(false));
      panelLinks.forEach((link) => link.addEventListener("click", () => setMenuState(false)));
      window.addEventListener("keydown", (event) => {
        if (event.key === "Escape") setMenuState(false);
      });
    })();
  </script>
