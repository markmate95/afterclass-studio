<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AfterClass Studio - Hero Prototype</title>
  <style>
    :root {
      --acs-ivory: #f7f1e7;
      --acs-porcelain: #fffaf1;
      --acs-sand: #ded0bb;
      --acs-warm-sand: #c7ad8f;
      --acs-champagne: #e8d9bd;
      --acs-ink: #171512;
      --acs-muted: rgba(23, 21, 18, 0.62);
      --acs-soft-line: rgba(23, 21, 18, 0.14);
      --acs-glass: rgba(255, 250, 241, 0.58);
      --acs-shadow: 0 28px 90px rgba(76, 61, 42, 0.13);
      --acs-ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-width: 320px;
      color: var(--acs-ink);
      background: var(--acs-ivory);
      font-family: "Inter", "Helvetica Neue", Arial, sans-serif;
    }

    body.acs-lock {
      overflow: hidden;
    }

    .acs-hero-shell {
      position: relative;
      min-height: 100svh;
      overflow: hidden;
      isolation: isolate;
      background:
        radial-gradient(circle at 17% 22%, rgba(255, 255, 255, 0.92), transparent 28rem),
        radial-gradient(circle at 82% 18%, rgba(232, 217, 189, 0.68), transparent 31rem),
        linear-gradient(135deg, var(--acs-porcelain), var(--acs-ivory) 48%, #efe2cf);
    }

    .acs-hero-shell::before,
    .acs-hero-shell::after {
      content: "";
      position: absolute;
      inset: auto;
      z-index: -2;
      pointer-events: none;
      border-radius: 999px;
      filter: blur(8px);
      opacity: 0.8;
    }

    .acs-hero-shell::before {
      width: 36rem;
      height: 36rem;
      right: -12rem;
      top: 16%;
      background: radial-gradient(circle, rgba(232, 217, 189, 0.45), transparent 68%);
      animation: acs-drift-one 12s var(--acs-ease) infinite alternate;
    }

    .acs-hero-shell::after {
      width: 30rem;
      height: 30rem;
      left: -11rem;
      bottom: -7rem;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.84), transparent 72%);
      animation: acs-drift-two 14s var(--acs-ease) infinite alternate;
    }

    .acs-grain {
      position: absolute;
      inset: 0;
      z-index: -1;
      opacity: 0.22;
      pointer-events: none;
      background-image:
        linear-gradient(115deg, transparent 0 47%, rgba(23, 21, 18, 0.08) 48% 48.4%, transparent 49% 100%),
        radial-gradient(circle at 18% 29%, rgba(23, 21, 18, 0.1) 0 0.045rem, transparent 0.052rem),
        radial-gradient(circle at 74% 64%, rgba(23, 21, 18, 0.12) 0 0.04rem, transparent 0.052rem);
      background-size: 100% 100%, 0.82rem 0.82rem, 1.1rem 1.1rem;
      mix-blend-mode: multiply;
    }

    .acs-header {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 20;
      display: grid;
      grid-template-columns: minmax(9rem, 13rem) 1fr auto;
      align-items: center;
      width: 100%;
      padding: clamp(1.2rem, 2.4vw, 2rem) clamp(1rem, 4vw, 4.5rem);
      gap: 1.5rem;
    }

    .acs-logo-link {
      display: inline-flex;
      align-items: center;
      width: min(13rem, 42vw);
      opacity: 0;
      transform: translateY(-0.8rem);
      animation: acs-reveal-down 0.9s var(--acs-ease) 3.35s forwards;
    }

    .acs-logo {
      display: block;
      width: 100%;
      height: auto;
      filter: drop-shadow(0 0.75rem 1.5rem rgba(50, 39, 27, 0.11));
    }

    .acs-desktop-nav {
      justify-self: center;
      display: flex;
      align-items: center;
      gap: clamp(0.35rem, 1vw, 0.8rem);
      padding: 0.42rem;
      border: 1px solid rgba(23, 21, 18, 0.1);
      border-radius: 999px;
      background: rgba(255, 250, 241, 0.5);
      box-shadow: 0 1.3rem 3rem rgba(73, 58, 39, 0.08);
      backdrop-filter: blur(18px);
      opacity: 0;
      transform: translateY(-0.8rem);
      animation: acs-reveal-down 0.9s var(--acs-ease) 3.48s forwards;
    }

    .acs-nav-link {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      min-height: 2.35rem;
      padding: 0 0.9rem;
      border-radius: 999px;
      color: rgba(23, 21, 18, 0.72);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.13em;
      text-decoration: none;
      text-transform: uppercase;
      transition: color 240ms ease, background-color 240ms ease, transform 240ms ease;
    }

    .acs-nav-link span {
      color: rgba(23, 21, 18, 0.36);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 0.78rem;
      font-style: italic;
      letter-spacing: 0;
    }

    .acs-nav-link:hover,
    .acs-nav-link:focus-visible {
      color: var(--acs-ink);
      background: rgba(255, 255, 255, 0.62);
      transform: translateY(-1px);
      outline: none;
    }

    .acs-socials {
      justify-self: end;
      display: flex;
      align-items: center;
      gap: 0.45rem;
      opacity: 0;
      transform: translateY(-0.8rem);
      animation: acs-reveal-down 0.9s var(--acs-ease) 3.6s forwards;
    }

    .acs-social-link {
      display: grid;
      place-items: center;
      width: 2.55rem;
      height: 2.55rem;
      border: 1px solid rgba(23, 21, 18, 0.11);
      border-radius: 999px;
      color: var(--acs-ink);
      background: rgba(255, 250, 241, 0.42);
      box-shadow: 0 0.8rem 2rem rgba(73, 58, 39, 0.06);
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-decoration: none;
      backdrop-filter: blur(16px);
      transition: border-color 240ms ease, background-color 240ms ease, transform 240ms ease;
    }

    .acs-social-link:hover,
    .acs-social-link:focus-visible {
      border-color: rgba(23, 21, 18, 0.25);
      background: rgba(255, 255, 255, 0.72);
      transform: translateY(-2px);
      outline: none;
    }

    .acs-menu-toggle {
      display: none;
      justify-self: end;
      align-items: center;
      justify-content: center;
      min-height: 2.75rem;
      padding: 0 1.05rem;
      border: 1px solid rgba(23, 21, 18, 0.12);
      border-radius: 999px;
      color: var(--acs-ink);
      background: rgba(255, 250, 241, 0.62);
      box-shadow: 0 1.1rem 2.6rem rgba(73, 58, 39, 0.08);
      font: 800 0.72rem/1 "Inter", "Helvetica Neue", Arial, sans-serif;
      letter-spacing: 0.18em;
      cursor: pointer;
      backdrop-filter: blur(16px);
      opacity: 0;
      transform: translateY(-0.8rem);
      animation: acs-reveal-down 0.9s var(--acs-ease) 3.5s forwards;
    }

    .acs-mobile-panel {
      position: fixed;
      inset: 0.75rem;
      z-index: 60;
      display: grid;
      align-content: center;
      gap: 1.2rem;
      padding: clamp(1.2rem, 6vw, 2.2rem);
      border: 1px solid rgba(23, 21, 18, 0.12);
      border-radius: 2rem;
      background:
        radial-gradient(circle at 80% 10%, rgba(232, 217, 189, 0.82), transparent 18rem),
        rgba(255, 250, 241, 0.92);
      box-shadow: var(--acs-shadow);
      backdrop-filter: blur(24px);
      opacity: 0;
      visibility: hidden;
      transform: scale(0.97);
      transition: opacity 320ms ease, transform 320ms ease, visibility 320ms ease;
    }

    .acs-mobile-panel.is-open {
      opacity: 1;
      visibility: visible;
      transform: scale(1);
    }

    .acs-mobile-close {
      position: absolute;
      top: 1rem;
      right: 1rem;
      display: grid;
      place-items: center;
      width: 2.8rem;
      height: 2.8rem;
      border: 1px solid rgba(23, 21, 18, 0.13);
      border-radius: 999px;
      color: var(--acs-ink);
      background: rgba(255, 255, 255, 0.55);
      font-size: 1.3rem;
      cursor: pointer;
    }

    .acs-mobile-nav {
      display: grid;
      gap: 0.5rem;
    }

    .acs-mobile-nav .acs-nav-link {
      justify-content: space-between;
      min-height: 3.6rem;
      padding: 0 1rem;
      border-bottom: 1px solid rgba(23, 21, 18, 0.1);
      border-radius: 0;
      font-size: clamp(1.1rem, 6vw, 2rem);
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 400;
      letter-spacing: -0.02em;
      text-transform: none;
    }

    .acs-mobile-socials {
      display: flex;
      flex-wrap: wrap;
      gap: 0.55rem;
      padding-top: 1rem;
    }

    .acs-hero-content {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(16rem, 23rem);
      align-items: end;
      min-height: 100svh;
      width: min(100%, 1320px);
      margin: 0 auto;
      padding:
        clamp(7.5rem, 14vw, 11rem)
        clamp(1rem, 4vw, 4.5rem)
        clamp(2rem, 7vw, 4.8rem);
      gap: clamp(2.2rem, 7vw, 5.5rem);
    }

    .acs-hero-copy {
      position: relative;
      max-width: 57rem;
    }

    .acs-eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 0.8rem;
      margin-bottom: clamp(1.2rem, 2vw, 1.8rem);
      color: rgba(23, 21, 18, 0.54);
      font-size: 0.76rem;
      font-weight: 800;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      opacity: 0;
      transform: translateY(1rem);
      animation: acs-reveal-up 1s var(--acs-ease) 3.72s forwards;
    }

    .acs-eyebrow::before {
      content: "";
      width: clamp(2.8rem, 8vw, 7rem);
      height: 1px;
      background: currentColor;
      opacity: 0.36;
    }

    .acs-hero-title {
      max-width: 12.5ch;
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(4rem, 10.8vw, 10.8rem);
      font-weight: 400;
      line-height: 0.89;
      letter-spacing: -0.075em;
      text-wrap: balance;
      opacity: 0;
      transform: translateY(1.5rem);
      animation: acs-reveal-up 1.08s var(--acs-ease) 3.82s forwards;
    }

    .acs-hero-title em {
      position: relative;
      display: inline-block;
      font-style: italic;
      letter-spacing: -0.09em;
    }

    .acs-hero-title em::after {
      content: "";
      position: absolute;
      left: 0.06em;
      right: -0.04em;
      bottom: 0.05em;
      z-index: -1;
      height: 0.13em;
      border-radius: 999px;
      background: linear-gradient(90deg, transparent, rgba(232, 217, 189, 0.84), transparent);
      transform: scaleX(0);
      transform-origin: left;
      animation: acs-line-write 1s var(--acs-ease) 4.35s forwards;
    }

    .acs-services {
      display: flex;
      flex-wrap: wrap;
      gap: 0.72rem;
      max-width: 48rem;
      margin-top: clamp(1.6rem, 3vw, 2.4rem);
      opacity: 0;
      transform: translateY(1.2rem);
      animation: acs-reveal-up 0.95s var(--acs-ease) 4.02s forwards;
    }

    .acs-service-pill {
      position: relative;
      display: inline-flex;
      min-height: 3rem;
      align-items: center;
      padding: 0 1rem;
      overflow: hidden;
      border: 1px solid rgba(23, 21, 18, 0.12);
      border-radius: 999px;
      background: rgba(255, 250, 241, 0.46);
      box-shadow: 0 1.15rem 2.5rem rgba(73, 58, 39, 0.07);
      color: rgba(23, 21, 18, 0.74);
      font-size: clamp(0.75rem, 1vw, 0.84rem);
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      backdrop-filter: blur(18px);
    }

    .acs-service-pill::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(110deg, transparent 0 34%, rgba(255, 255, 255, 0.65) 45%, transparent 57% 100%);
      transform: translateX(-130%);
      animation: acs-polish 6s ease-in-out infinite;
      animation-delay: calc(var(--acs-i) * 420ms + 4.6s);
    }

    .acs-hero-card {
      position: relative;
      align-self: center;
      min-height: 29rem;
      padding: 1rem;
      border: 1px solid rgba(23, 21, 18, 0.1);
      border-radius: 2.1rem;
      background:
        linear-gradient(160deg, rgba(255, 255, 255, 0.58), rgba(255, 250, 241, 0.22)),
        rgba(255, 250, 241, 0.35);
      box-shadow: var(--acs-shadow);
      backdrop-filter: blur(20px);
      opacity: 0;
      transform: translateY(1.4rem) rotate(1.2deg);
      animation: acs-card-in 1.12s var(--acs-ease) 4.05s forwards;
    }

    .acs-orbit {
      position: absolute;
      inset: 1.2rem;
      border: 1px solid rgba(23, 21, 18, 0.12);
      border-radius: 1.55rem;
    }

    .acs-orbit::before,
    .acs-orbit::after {
      content: "";
      position: absolute;
      border-radius: 999px;
      background: var(--acs-ink);
      opacity: 0.58;
    }

    .acs-orbit::before {
      width: 0.42rem;
      height: 0.42rem;
      top: -0.24rem;
      left: 24%;
      animation: acs-dot-one 7s linear infinite;
    }

    .acs-orbit::after {
      width: 0.34rem;
      height: 0.34rem;
      right: -0.2rem;
      bottom: 30%;
      animation: acs-dot-two 9s linear infinite;
    }

    .acs-line-art {
      position: absolute;
      inset: 2.2rem 1.8rem;
      opacity: 0.76;
    }

    .acs-line-art path {
      fill: none;
      stroke: rgba(23, 21, 18, 0.62);
      stroke-width: 1.4;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      animation: acs-draw-path 2.2s var(--acs-ease) 4.3s forwards;
    }

    .acs-card-meta {
      position: absolute;
      left: 1.65rem;
      right: 1.65rem;
      bottom: 1.55rem;
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      color: rgba(23, 21, 18, 0.48);
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .acs-scroll-mark {
      position: absolute;
      left: clamp(1rem, 4vw, 4.5rem);
      bottom: clamp(1.2rem, 3vw, 2.4rem);
      display: grid;
      place-items: center;
      width: 3rem;
      height: 3rem;
      border: 1px solid rgba(23, 21, 18, 0.14);
      border-radius: 999px;
      color: var(--acs-ink);
      text-decoration: none;
      opacity: 0;
      transform: translateY(0.7rem);
      animation: acs-reveal-up 0.9s var(--acs-ease) 4.38s forwards;
    }

    .acs-scroll-mark::before {
      content: "";
      width: 0.55rem;
      height: 0.55rem;
      border-right: 1px solid currentColor;
      border-bottom: 1px solid currentColor;
      transform: translateY(-0.15rem) rotate(45deg);
      animation: acs-scroll-bounce 1.6s ease-in-out infinite;
    }

    .acs-intro {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 48%, rgba(255, 255, 255, 0.96), transparent 22rem),
        linear-gradient(135deg, #fffaf1, #efe2cf);
      pointer-events: none;
      animation: acs-intro-out 0.9s var(--acs-ease) 3.05s forwards;
    }

    .acs-intro::before {
      content: "";
      position: absolute;
      inset: 10%;
      border: 1px solid rgba(23, 21, 18, 0.1);
      border-radius: 2.2rem;
      opacity: 0;
      animation: acs-frame-in 1s var(--acs-ease) 0.25s forwards;
    }

    .acs-intro-mark {
      position: relative;
      display: grid;
      place-items: center;
      width: min(74vw, 42rem);
      aspect-ratio: 1.68;
    }

    .acs-intro-mark::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: 5%;
      width: 42%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(23, 21, 18, 0.32), transparent);
      transform: translateX(-50%) scaleX(0);
      animation: acs-stage-line 0.9s var(--acs-ease) 0.35s forwards;
    }

    .acs-dancer {
      position: absolute;
      width: 38%;
      max-width: 15rem;
      opacity: 0;
      filter: drop-shadow(0 1.5rem 2rem rgba(73, 58, 39, 0.14));
    }

    .acs-dancer-left {
      left: 8%;
      top: 11%;
      transform-origin: 55% 55%;
      animation: acs-dancer-left 2.75s var(--acs-ease) 0.28s forwards;
    }

    .acs-dancer-right {
      right: 7%;
      top: 12%;
      transform-origin: 43% 53%;
      animation: acs-dancer-right 2.75s var(--acs-ease) 0.28s forwards;
    }

    .acs-dancer path,
    .acs-dancer circle {
      fill: none;
      stroke: rgba(23, 21, 18, 0.82);
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.45;
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      animation: acs-draw-path 1.45s var(--acs-ease) 0.52s forwards;
    }

    .acs-dancer .acs-dress,
    .acs-dancer .acs-jacket {
      stroke: rgba(167, 133, 91, 0.78);
      stroke-width: 1.25;
    }

    .acs-intro-logo {
      position: absolute;
      top: 50%;
      left: 50%;
      width: min(16rem, 44vw);
      opacity: 0;
      transform: translate(-50%, -47%) scale(0.96);
      animation: acs-logo-rise 1.05s var(--acs-ease) 1.58s forwards;
    }

    .acs-intro-shine {
      position: absolute;
      inset: -15%;
      background: linear-gradient(115deg, transparent 0 43%, rgba(255, 255, 255, 0.55) 49%, transparent 55% 100%);
      transform: translateX(-90%);
      animation: acs-intro-shine 1.1s ease-in-out 1.9s forwards;
    }

    .acs-section-anchor {
      scroll-margin-top: 2rem;
    }

    @keyframes acs-drift-one {
      to {
        transform: translate(-2rem, 1.6rem) scale(1.08);
      }
    }

    @keyframes acs-drift-two {
      to {
        transform: translate(2.4rem, -1.2rem) scale(1.04);
      }
    }

    @keyframes acs-reveal-down {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes acs-reveal-up {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes acs-card-in {
      to {
        opacity: 1;
        transform: translateY(0) rotate(0deg);
      }
    }

    @keyframes acs-line-write {
      to {
        transform: scaleX(1);
      }
    }

    @keyframes acs-polish {
      0%, 42% {
        transform: translateX(-130%);
      }
      58%, 100% {
        transform: translateX(130%);
      }
    }

    @keyframes acs-dot-one {
      0% {
        transform: translate(0, 0);
      }
      25% {
        transform: translate(11rem, 0);
      }
      50% {
        transform: translate(11rem, 25rem);
      }
      75% {
        transform: translate(0, 25rem);
      }
      100% {
        transform: translate(0, 0);
      }
    }

    @keyframes acs-dot-two {
      0% {
        transform: translate(0, 0);
      }
      30% {
        transform: translate(-19rem, 0);
      }
      62% {
        transform: translate(-19rem, -15rem);
      }
      100% {
        transform: translate(0, 0);
      }
    }

    @keyframes acs-draw-path {
      to {
        stroke-dashoffset: 0;
      }
    }

    @keyframes acs-scroll-bounce {
      0%, 100% {
        transform: translateY(-0.2rem) rotate(45deg);
      }
      50% {
        transform: translateY(0.18rem) rotate(45deg);
      }
    }

    @keyframes acs-intro-out {
      to {
        opacity: 0;
        visibility: hidden;
      }
    }

    @keyframes acs-frame-in {
      to {
        opacity: 1;
        inset: 6%;
      }
    }

    @keyframes acs-stage-line {
      to {
        transform: translateX(-50%) scaleX(1);
      }
    }

    @keyframes acs-dancer-left {
      0% {
        opacity: 0;
        transform: translateX(-4rem) rotate(-10deg) scale(0.92);
      }
      36% {
        opacity: 1;
        transform: translateX(0.8rem) rotate(4deg) scale(1);
      }
      68% {
        opacity: 1;
        transform: translateX(1.8rem) rotate(-3deg) scale(1.02);
      }
      100% {
        opacity: 0;
        transform: translateX(-14rem) rotate(-9deg) scale(0.95);
      }
    }

    @keyframes acs-dancer-right {
      0% {
        opacity: 0;
        transform: translateX(4rem) rotate(9deg) scale(0.92);
      }
      36% {
        opacity: 1;
        transform: translateX(-0.8rem) rotate(-4deg) scale(1);
      }
      68% {
        opacity: 1;
        transform: translateX(-1.8rem) rotate(3deg) scale(1.02);
      }
      100% {
        opacity: 0;
        transform: translateX(14rem) rotate(8deg) scale(0.95);
      }
    }

    @keyframes acs-logo-rise {
      to {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }
    }

    @keyframes acs-intro-shine {
      to {
        transform: translateX(90%);
      }
    }

    @media (max-width: 1120px) {
      .acs-header {
        grid-template-columns: minmax(8rem, 12rem) 1fr auto;
      }

      .acs-desktop-nav,
      .acs-socials {
        display: none;
      }

      .acs-menu-toggle {
        display: inline-flex;
      }

      .acs-hero-content {
        grid-template-columns: 1fr;
        align-items: center;
      }

      .acs-hero-card {
        width: min(100%, 27rem);
        min-height: 20rem;
        margin-left: auto;
      }
    }

    @media (max-width: 720px) {
      .acs-header {
        padding: 1rem;
      }

      .acs-logo-link {
        width: min(11.5rem, 48vw);
      }

  <script>
    (() => {
      const body = document.body;
      const toggle = document.querySelector(".acs-menu-toggle");
      const panel = document.querySelector(".acs-mobile-panel");
      const close = document.querySelector(".acs-mobile-close");
      const panelLinks = document.querySelectorAll(".acs-mobile-panel a");
      const prefersReducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      const unlockIntro = () => body.classList.remove("acs-lock");

      if (prefersReducedMotion) {
        unlockIntro();
      } else {
        window.setTimeout(unlockIntro, 3600);
      }

      const setMenuState = (isOpen) => {
        panel.classList.toggle("is-open", isOpen);
        panel.setAttribute("aria-hidden", String(!isOpen));
        toggle.setAttribute("aria-expanded", String(isOpen));
        body.classList.toggle("acs-lock", isOpen);
      };

      toggle.addEventListener("click", () => setMenuState(true));
      close.addEventListener("click", () => setMenuState(false));
      panelLinks.forEach((link) => link.addEventListener("click", () => setMenuState(false)));

      window.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          setMenuState(false);
        }
      });
    })();
  </script>
