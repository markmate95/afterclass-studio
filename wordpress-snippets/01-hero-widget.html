<!-- AfterClass Studio - HERO HTML widget
Paste this into the first Elementor HTML widget/container.
This snippet includes the shared CSS used by the following Navbar and About snippets. -->
<style>
    @import url("https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap");

    :root {
      --acs-paper: #f4efe6;
      --acs-paper-2: #ebe2d5;
      --acs-cream: #fffaf1;
      --acs-ink: #11100e;
      --acs-muted: rgba(17, 16, 14, 0.58);
      --acs-line: rgba(17, 16, 14, 0.13);
      --acs-line-strong: rgba(17, 16, 14, 0.28);
      --acs-glass: rgba(255, 250, 241, 0.48);
      --acs-shadow: 0 34px 100px rgba(36, 29, 22, 0.10);
      --acs-ease: cubic-bezier(0.22, 1, 0.36, 1);
      --acs-x: 76%;
      --acs-y: 28%;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      color: var(--acs-ink);
      font-family: "Inter", "Helvetica Neue", Arial, sans-serif;
    }

    body.acs-menu-open { overflow: hidden; }

    .acs-page {
      position: relative;
      overflow: hidden;
      background: var(--acs-paper);
    }

    .acs-intro-scene,
    .acs-menu-scene,
    .acs-about-scene {
      position: relative;
      min-height: 100svh;
      overflow: hidden;
      isolation: isolate;
      background:
        radial-gradient(circle at var(--acs-x) var(--acs-y), rgba(255, 255, 255, 1) 0 7rem, rgba(255, 250, 241, 0.88) 12rem, transparent 27rem),
        radial-gradient(circle at 17% 22%, rgba(255, 250, 241, 0.9), transparent 31rem),
        linear-gradient(135deg, var(--acs-paper), var(--acs-paper-2));
    }

    .acs-intro-scene::before,
    .acs-menu-scene::before,
    .acs-about-scene::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -3;
      pointer-events: none;
      background:
        linear-gradient(90deg, rgba(17, 16, 14, 0.045) 1px, transparent 1px),
        linear-gradient(180deg, rgba(17, 16, 14, 0.035) 1px, transparent 1px);
      background-size: clamp(3.2rem, 5vw, 5.4rem) clamp(3.2rem, 5vw, 5.4rem);
      mask-image: linear-gradient(90deg, rgba(0,0,0,0.72), rgba(0,0,0,0.16));
    }

    .acs-intro-scene::after,
    .acs-menu-scene::after,
    .acs-about-scene::after {
      content: "";
      position: absolute;
      inset: 1rem;
      z-index: -1;
      border: 1px solid rgba(17, 16, 14, 0.09);
      border-radius: clamp(1.05rem, 1.8vw, 1.8rem);
      pointer-events: none;
    }

    .acs-noise,
    .acs-sweep,
    .acs-cinema-lines {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .acs-noise {
      z-index: -2;
      opacity: 0.22;
      mix-blend-mode: multiply;
      background-image:
        radial-gradient(circle at 20% 30%, rgba(17,16,14,0.12) 0 0.04rem, transparent 0.047rem),
        radial-gradient(circle at 75% 60%, rgba(17,16,14,0.10) 0 0.035rem, transparent 0.043rem);
      background-size: 0.85rem 0.85rem, 1.15rem 1.15rem;
      animation: acs-noise-drift 7s steps(5) infinite;
    }

    .acs-sweep {
      z-index: -1;
      opacity: 0.46;
      background: linear-gradient(102deg, transparent 0 40%, rgba(255, 255, 255, 0.98) 50%, transparent 61% 100%);
      transform: translateX(-55%);
      animation: acs-sweep 7.5s var(--acs-ease) infinite alternate;
    }

    .acs-cinema-lines { z-index: 0; }

    .acs-cinema-lines::before,
    .acs-cinema-lines::after {
      content: "";
      position: absolute;
      left: 0;
      width: 100%;
      height: clamp(0.38rem, 0.75vw, 0.62rem);
      background: rgba(17, 16, 14, 0.92);
      transform: scaleX(0);
      animation: acs-line-open 1.05s var(--acs-ease) 0.08s forwards;
    }

    .acs-cinema-lines::before { top: 0; transform-origin: left; }
    .acs-cinema-lines::after { bottom: 0; transform-origin: right; }

    .acs-intro-content {
      position: relative;
      z-index: 2;
      display: grid;
      place-items: center;
      width: min(100%, 1540px);
      min-height: 100svh;
      margin: 0 auto;
      padding: clamp(5.6rem, 9vw, 8rem) clamp(0.65rem, 2.6vw, 3rem);
    }

    .acs-title {
      width: min(100%, 14.8ch);
      min-height: 2.78em;
      margin: 0 auto;
      color: var(--acs-ink);
      font-family: "Instrument Serif", "Bodoni 72", Didot, Georgia, serif;
      font-size: clamp(4.9rem, 11.85vw, 15rem);
      font-weight: 400;
      line-height: 1.02;
      letter-spacing: -0.068em;
      text-align: center;
      text-wrap: balance;
    }

    .acs-title.is-typing::after {
      content: "";
      display: inline-block;
      width: 0.045em;
      height: 0.72em;
      margin-left: 0.04em;
      background: currentColor;
      transform: translateY(0.08em);
      animation: acs-caret 0.85s steps(1) infinite;
    }

    .acs-title.is-complete::after { opacity: 0; }


    .acs-gold-ribbon {
      position: absolute;
      left: 50%;
      top: calc(50% + min(24vh, 14rem));
      z-index: 3;
      width: min(62vw, 45rem);
      min-width: 18rem;
      pointer-events: none;
      opacity: 0;
      transform: translate(-50%, 1.1rem) scaleX(0.78);
      transform-origin: center;
      transition: opacity 850ms var(--acs-ease), transform 1200ms var(--acs-ease);
    }

    body.acs-intro-ready .acs-gold-ribbon {
      opacity: 1;
      transform: translate(-50%, 0) scaleX(1);
    }

    .acs-gold-ribbon svg {
      display: block;
      width: 100%;
      height: auto;
      overflow: visible;
      filter: drop-shadow(0 1.5rem 2.6rem rgba(139, 96, 38, 0.18));
    }

    .acs-gold-ribbon .acs-ribbon-part {
      opacity: 0;
      transform-box: fill-box;
      transform-origin: center;
    }

    body.acs-intro-ready .acs-gold-ribbon .acs-ribbon-band {
      animation: acs-ribbon-band 1.25s var(--acs-ease) 0.18s forwards;
    }

    body.acs-intro-ready .acs-gold-ribbon .acs-ribbon-knot {
      animation: acs-ribbon-pop 0.9s var(--acs-ease) 0.78s forwards;
    }

    body.acs-intro-ready .acs-gold-ribbon .acs-ribbon-loop-left {
      animation: acs-ribbon-loop-left 1.05s var(--acs-ease) 0.96s forwards;
    }

    body.acs-intro-ready .acs-gold-ribbon .acs-ribbon-loop-right {
      animation: acs-ribbon-loop-right 1.05s var(--acs-ease) 1.02s forwards;
    }

    body.acs-intro-ready .acs-gold-ribbon .acs-ribbon-tail-left {
      animation: acs-ribbon-tail-left 1s var(--acs-ease) 1.12s forwards;
    }

    body.acs-intro-ready .acs-gold-ribbon .acs-ribbon-tail-right {
      animation: acs-ribbon-tail-right 1s var(--acs-ease) 1.16s forwards;
    }

    .acs-ribbon-shine {
      opacity: 0;
      transform: translateX(-70%);
    }

    body.acs-intro-ready .acs-ribbon-shine {
      animation: acs-ribbon-shine 2.2s ease-in-out 1.55s forwards;
    }

    .acs-scroll-cue {
      position: absolute;
      left: 50%;
      bottom: clamp(1.2rem, 3vw, 2.4rem);
      z-index: 5;
      display: inline-grid;
      place-items: center;
      width: 2.6rem;
      height: 2.6rem;
      border: 1px solid var(--acs-line);
      border-radius: 999px;
      color: var(--acs-ink);
      background: rgba(255, 250, 241, 0.42);
      text-decoration: none;
      opacity: 0;
      pointer-events: none;
      transform: translateX(-50%) translateY(0.8rem);
      transition: opacity 850ms var(--acs-ease), transform 850ms var(--acs-ease), background-color 220ms ease;
      backdrop-filter: blur(16px);
    }

    body.acs-intro-ready .acs-scroll-cue {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(-50%) translateY(0);
      transition-delay: 1.35s;
    }

    .acs-scroll-cue::before {
      content: "";
      width: 0.46rem;
      height: 0.46rem;
      border-right: 1px solid currentColor;
      border-bottom: 1px solid currentColor;
      transform: translateY(-0.12rem) rotate(45deg);
      animation: acs-arrow 1.75s ease-in-out infinite;
    }

    .acs-scroll-cue:hover,
    .acs-scroll-cue:focus-visible {
      background: rgba(255, 250, 241, 0.84);
      outline: none;
    }


    .acs-scroll-gate {
      position: absolute;
      left: 50%;
      bottom: clamp(4.25rem, 6vw, 5.7rem);
      z-index: 5;
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      color: rgba(17, 16, 14, 0.44);
      font-size: 0.66rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      opacity: 0;
      pointer-events: none;
      transform: translateX(-50%) translateY(0.8rem);
      transition: opacity 850ms var(--acs-ease), transform 850ms var(--acs-ease), color 260ms ease;
      transition-delay: 1.15s;
    }

    body.acs-intro-ready .acs-scroll-gate {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .acs-scroll-gate::before,
    .acs-scroll-gate::after {
      content: "";
      width: 2.4rem;
      height: 1px;
      background: currentColor;
      opacity: 0.32;
    }

    .acs-scroll-gate.is-armed {
      color: rgba(17, 16, 14, 0.72);
    }

    .acs-curve-flow {
      position: absolute;
      left: 50%;
      bottom: -21vh;
      z-index: 1;
      width: 150vw;
      height: 46vh;
      pointer-events: none;
      opacity: 0;
      transform: translateX(-50%) translateY(38%);
      transition: opacity 1100ms var(--acs-ease), transform 1400ms var(--acs-ease);
    }

    body.acs-intro-ready .acs-curve-flow {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
      transition-delay: 0.7s;
    }

    .acs-curve-flow span {
      position: absolute;
      left: 50%;
      bottom: 0;
      width: 100%;
      height: 100%;
      border-radius: 50% 50% 0 0 / 100% 100% 0 0;
      transform: translateX(-50%);
      background: var(--curve-color);
      box-shadow: 0 -1px 0 rgba(17, 16, 14, 0.06), 0 -38px 120px rgba(255, 250, 241, 0.55);
    }

    .acs-curve-flow span:nth-child(1) {
      --curve-color: rgba(255, 250, 241, 0.52);
      bottom: 19vh;
      width: 132vw;
      height: 25vh;
      transform: translateX(-50%) rotate(-1.8deg);
    }

    .acs-curve-flow span:nth-child(2) {
      --curve-color: rgba(244, 239, 230, 0.78);
      bottom: 9vh;
      width: 142vw;
      height: 31vh;
      transform: translateX(-50%) rotate(1.2deg);
    }

    .acs-curve-flow span:nth-child(3) {
      --curve-color: var(--acs-cream);
      bottom: -1vh;
      width: 154vw;
      height: 35vh;
    }

    .acs-menu-scene {
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at var(--acs-x) var(--acs-y), rgba(255, 255, 255, 1) 0 7rem, rgba(255, 250, 241, 0.9) 12rem, transparent 29rem),
        linear-gradient(135deg, var(--acs-cream), #f0e7da);
    }

    .acs-menu-composition {
      position: relative;
      z-index: 3;
      display: grid;
      justify-items: center;
      gap: clamp(2rem, 4vw, 3.8rem);
      width: min(100%, 980px);
      padding: clamp(4rem, 8vw, 7rem) clamp(1rem, 4vw, 3rem);
      opacity: 0;
      transform: translateY(2rem);
      transition: opacity 900ms var(--acs-ease), transform 900ms var(--acs-ease);
    }

    .acs-menu-scene.is-visible .acs-menu-composition {
      opacity: 1;
      transform: translateY(0);
    }

    .acs-logo-link {
      display: inline-flex;
      align-items: center;
      width: min(18rem, 62vw);
      text-decoration: none;
    }

    .acs-logo {
      display: block;
      width: 100%;
      height: auto;
      filter: url(#acs-logo-cutout);
    }

    .acs-center-layout {
      display: grid;
      grid-template-columns: auto minmax(18rem, 34rem);
      align-items: center;
      gap: clamp(1.6rem, 5vw, 5rem);
      width: min(100%, 46rem);
    }

    .acs-socials {
      display: grid;
      gap: 0.55rem;
      justify-items: center;
    }

    .acs-social-link {
      display: grid;
      place-items: center;
      width: 2.7rem;
      height: 2.7rem;
      border: 1px solid var(--acs-line);
      border-radius: 999px;
      color: var(--acs-ink);
      background: rgba(255, 250, 241, 0.42);
      box-shadow: 0 14px 36px rgba(36, 29, 22, 0.045);
      text-decoration: none;
      backdrop-filter: blur(16px);
      transition: border-color 220ms ease, background-color 220ms ease, transform 220ms ease;
    }

    .acs-social-link svg {
      display: block;
      width: 1rem;
      height: 1rem;
      fill: currentColor;
    }

    .acs-social-link:hover,
    .acs-social-link:focus-visible {
      border-color: var(--acs-line-strong);
      background: rgba(255, 250, 241, 0.86);
      transform: translateY(-2px);
      outline: none;
    }

    .acs-nav {
      display: grid;
      width: 100%;
      border-top: 1px solid var(--acs-line);
    }

    .acs-nav-link,
    .acs-mobile-nav .acs-nav-link {
      position: relative;
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 1rem;
      min-height: clamp(3.75rem, 6vw, 5.2rem);
      padding-right: 0.5rem;
      overflow: visible;
      border-bottom: 1px solid var(--acs-line);
      color: var(--acs-ink);
      font-family: "Instrument Serif", "Bodoni 72", Didot, Georgia, serif;
      font-size: clamp(1.8rem, 3.4vw, 3rem);
      line-height: 0.98;
      letter-spacing: -0.045em;
      text-decoration: none;
      white-space: nowrap;
    }

    .acs-nav-link::before,
    .acs-mobile-nav .acs-nav-link::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background: rgba(255, 250, 241, 0.42);
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 520ms var(--acs-ease);
    }

    .acs-nav-link::after,
    .acs-mobile-nav .acs-nav-link::after {
      content: "";
      width: 1.12rem;
      height: 1.12rem;
      border-top: 1px solid currentColor;
      border-right: 1px solid currentColor;
      opacity: 0.48;
      transform: translateX(-0.18rem) rotate(45deg);
      transition: opacity 260ms ease, transform 420ms var(--acs-ease);
    }

    .acs-nav-link:hover::before,
    .acs-nav-link:focus-visible::before,
    .acs-mobile-nav .acs-nav-link:hover::before,
    .acs-mobile-nav .acs-nav-link:focus-visible::before {
      transform: scaleX(1);
    }

    .acs-nav-link:hover::after,
    .acs-nav-link:focus-visible::after,
    .acs-mobile-nav .acs-nav-link:hover::after,
    .acs-mobile-nav .acs-nav-link:focus-visible::after {
      opacity: 1;
      transform: translateX(0.18rem) rotate(45deg);
    }

    .acs-nav-link:focus-visible,
    .acs-mobile-nav .acs-nav-link:focus-visible { outline: none; }

    .acs-menu-toggle {
      position: fixed;
      top: 1rem;
      right: 1rem;
      z-index: 60;
      display: none;
      min-height: 2.65rem;
      padding: 0 1rem;
      border: 1px solid var(--acs-line);
      border-radius: 999px;
      color: var(--acs-ink);
      background: rgba(255, 250, 241, 0.72);
      box-shadow: 0 14px 36px rgba(36, 29, 22, 0.055);
      font: 700 0.72rem/1 "Inter", "Helvetica Neue", Arial, sans-serif;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      cursor: pointer;
      backdrop-filter: blur(16px);
    }

    .acs-mobile-panel {
      position: fixed;
      inset: 0.75rem;
      z-index: 80;
      display: grid;
      align-content: center;
      gap: 1.2rem;
      padding: clamp(1.2rem, 6vw, 2.4rem);
      border: 1px solid var(--acs-line);
      border-radius: 1.8rem;
      background: rgba(244, 239, 230, 0.95);
      box-shadow: var(--acs-shadow);
      backdrop-filter: blur(24px);
      opacity: 0;
      visibility: hidden;
      transform: scale(0.98);
      transition: opacity 260ms ease, visibility 260ms ease, transform 260ms ease;
    }

    .acs-mobile-panel.is-open {
      opacity: 1;
      visibility: visible;
      transform: scale(1);
    }

    .acs-mobile-close {
      position: absolute;
      top: 1rem;
      right: 1rem;
      display: grid;
      place-items: center;
      width: 2.8rem;
      height: 2.8rem;
      border: 1px solid var(--acs-line);
      border-radius: 999px;
      color: var(--acs-ink);
      background: rgba(255, 250, 241, 0.7);
      font-size: 1.25rem;
      cursor: pointer;
    }

    .acs-mobile-nav {
      display: grid;
      gap: 0.35rem;
    }

    .acs-mobile-socials {
      display: flex;
      gap: 0.55rem;
      padding-top: 1rem;
    }


    .acs-menu-scroll-cue {
      position: absolute;
      left: 50%;
      bottom: clamp(1.2rem, 3vw, 2.4rem);
      z-index: 5;
      display: inline-grid;
      place-items: center;
      width: 2.6rem;
      height: 2.6rem;
      border: 1px solid var(--acs-line);
      border-radius: 999px;
      color: var(--acs-ink);
      background: rgba(255, 250, 241, 0.42);
      text-decoration: none;
      opacity: 0;
      pointer-events: none;
      transform: translateX(-50%) translateY(0.8rem);
      transition: opacity 850ms var(--acs-ease), transform 850ms var(--acs-ease), background-color 220ms ease;
      backdrop-filter: blur(16px);
    }

    .acs-menu-scene.is-visible .acs-menu-scroll-cue {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(-50%) translateY(0);
      transition-delay: 0.65s;
    }

    .acs-menu-scroll-cue::before {
      content: "";
      width: 0.46rem;
      height: 0.46rem;
      border-right: 1px solid currentColor;
      border-bottom: 1px solid currentColor;
      transform: translateY(-0.12rem) rotate(45deg);
      animation: acs-arrow 1.75s ease-in-out infinite;
    }

    .acs-menu-gate {
      position: absolute;
      left: 50%;
      bottom: clamp(4.25rem, 6vw, 5.7rem);
      z-index: 5;
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      color: rgba(17, 16, 14, 0.44);
      font-size: 0.66rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      opacity: 0;
      pointer-events: none;
      transform: translateX(-50%) translateY(0.8rem);
      transition: opacity 850ms var(--acs-ease), transform 850ms var(--acs-ease), color 260ms ease;
      transition-delay: 0.55s;
    }

    .acs-menu-scene.is-visible .acs-menu-gate {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .acs-menu-gate::before,
    .acs-menu-gate::after {
      content: "";
      width: 2.4rem;
      height: 1px;
      background: currentColor;
      opacity: 0.32;
    }

    .acs-menu-gate.is-armed {
      color: rgba(17, 16, 14, 0.72);
    }

    .acs-about-scene {
      display: grid;
      align-items: center;
      min-height: 100svh;
      background:
        radial-gradient(circle at var(--acs-x) var(--acs-y), rgba(255, 255, 255, 1) 0 7rem, rgba(255, 250, 241, 0.88) 12rem, transparent 27rem),
        radial-gradient(circle at 17% 22%, rgba(255, 250, 241, 0.9), transparent 31rem),
        linear-gradient(135deg, var(--acs-paper), var(--acs-paper-2));
    }

    .acs-section-curve-reveal {
      position: absolute;
      inset: -8vh -8vw auto -8vw;
      z-index: 2;
      height: 122vh;
      pointer-events: none;
      background:
        radial-gradient(circle at 50% 12%, rgba(255,255,255,0.98), rgba(255,250,241,0.94) 36%, rgba(244,239,230,0.96) 100%);
      border-radius: 0 0 50% 50% / 0 0 16% 16%;
      box-shadow: 0 3rem 8rem rgba(61, 46, 30, 0.08);
      opacity: 1;
      transform: translateY(0);
      transition: transform 2400ms var(--acs-ease), opacity 1800ms ease;
    }

    .acs-about-scene.is-visible .acs-section-curve-reveal {
      opacity: 0;
      transform: translateY(-112%);
    }

    .acs-about-wrap {
      position: relative;
      z-index: 3;
      display: grid;
      grid-template-columns: minmax(0, 1.12fr) minmax(22rem, 0.72fr);
      align-items: center;
      gap: clamp(1.4rem, 3.6vw, 3.7rem);
      width: min(100%, 1540px);
      margin: 0 auto;
      padding: clamp(5rem, 8vw, 8rem) clamp(1rem, 4.2vw, 4.9rem);
    }

    .acs-about-copy {
      position: relative;
      max-width: 74rem;
      opacity: 0;
      filter: blur(14px);
      transform: translateY(3.2rem) scale(0.985) rotate(0.001deg);
      transition: opacity 1900ms var(--acs-ease) 420ms, filter 1800ms ease 420ms, transform 2100ms var(--acs-ease) 420ms;
    }

    .acs-about-scene.is-visible .acs-about-copy {
      opacity: 1;
      filter: blur(0);
      transform: translateY(0) scale(1);
    }

    .acs-about-copy::before {
      content: "";
      position: absolute;
      left: 0;
      top: -1.45rem;
      width: min(14rem, 38vw);
      height: 1px;
      background: linear-gradient(90deg, rgba(17,16,14,0.35), transparent);
    }

    .acs-about-copy p {
      margin: 0;
      color: var(--acs-ink);
      font-family: "Instrument Serif", "Bodoni 72", Didot, Georgia, serif;
      font-size: clamp(2rem, 3.65vw, 4.2rem);
      font-weight: 400;
      line-height: 1.13;
      letter-spacing: -0.01em;
      text-wrap: balance;
    }

    .acs-about-copy p + p {
      margin-top: clamp(1.35rem, 2.4vw, 2.25rem);
      color: rgba(17, 16, 14, 0.66);
      font-size: clamp(1.2rem, 2vw, 2.12rem);
      line-height: 1.26;
      letter-spacing: 0;
